<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07110D"/>
      <stop offset="50%" stop-color="#0A1813"/>
      <stop offset="100%" stop-color="#12261E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#07110D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border accent -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="#1F3F32" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Logo & Title -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-2">
      STUMPD<tspan fill="#F59E0B">.</tspan>
    </text>
    <text x="0" y="55" font-family="monospace, monospace" font-weight="800" font-size="24" fill="#F59E0B" letter-spacing="4">
      THE 7-0 CRICKET DRAFT CHALLENGE
    </text>
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="28" fill="#A7F3D0" max-width="700">
      Draft your ultimate Playing XI across 11 tactical slots.
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#6EE7B7">
      Conquer historic dynasties in a tactical T20 gauntlet.
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="170" height="42" rx="12" fill="#12261E" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="85" y="27" font-family="monospace, monospace" font-weight="700" font-size="16" fill="#FCD34D" text-anchor="middle">👑 7-0 INVINCIBLE</text>

      <rect x="185" y="0" width="180" height="42" rx="12" fill="#12261E" stroke="#10B981" stroke-width="1.5"/>
      <text x="275" y="27" font-family="monospace, monospace" font-weight="700" font-size="16" fill="#6EE7B7" text-anchor="middle">⚡ DAILY STUMPD</text>

      <rect x="380" y="0" width="190" height="42" rx="12" fill="#12261E" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="475" y="27" font-family="monospace, monospace" font-weight="700" font-size="16" fill="#BAE6FD" text-anchor="middle">🏆 0–1000 POWER</text>
    </g>
  </g>

  <!-- Wicket Stumps Graphic (Right side) -->
  <g transform="translate(930, 240)">
    <!-- Bails -->
    <rect x="-6" y="-12" width="60" height="8" rx="3" fill="#FCD34D"/>
    <rect x="46" y="-12" width="60" height="8" rx="3" fill="#FCD34D"/>

    <!-- 3 Stumps -->
    <rect x="0" y="0" width="14" height="220" rx="5" fill="#F59E0B"/>
    <rect x="42" y="0" width="14" height="220" rx="5" fill="#F59E0B"/>
    <rect x="84" y="0" width="14" height="220" rx="5" fill="#F59E0B"/>

    <!-- Cricket Ball -->
    <circle cx="150" cy="90" r="34" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
    <path d="M 124 74 Q 150 90 176 106" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4,3" fill="none"/>
  </g>
</svg>
